<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pose Library</title>
<style>
  :root { --bg: #120a2b; --card: #24164d; --fg: #fff; --muted: #b9aef0; --mint: #3ee6b0; --pink: #ff5fa2; color-scheme: dark; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 Rubik, system-ui, sans-serif; padding: 24px max(16px, env(safe-area-inset-left)); }
  h1 { margin: 0 0 4px; font-size: 1.8rem; }
  p { margin: 0 0 18px; color: var(--muted); max-width: 70ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .card { background: var(--card); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
  canvas { width: 100%; aspect-ratio: 3 / 4; background: #1a1040; border-radius: 10px; }
  b { font-size: .95rem; }
  small { color: var(--muted); }
  .tag { align-self: flex-start; font-size: .7rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--pink); color: #120a2b; }
  .tag.src { background: var(--mint); }
</style>
</head>
<body>
<h1>Pose library</h1>
<p>Every pose the coach can suggest. Built-in poses come from standard portrait-photography practice; poses marked "from photo" were extracted from photos with the Add poses tool.</p>
<div class="grid" id="grid"></div>
<script type="module">
import { allPoses, loadExtraPoses } from "../js/poses.js";
const BONES = [[11, 12], [11, 13], [13, 15], [12, 14], [14, 16], [11, 23], [12, 24], [23, 24], [23, 25], [25, 27], [24, 26], [26, 28]];
await loadExtraPoses();
const grid = document.getElementById("grid");
for (const p of allPoses()) {
  const card = document.createElement("div"); card.className = "card";
  const c = document.createElement("canvas"); c.width = 300; c.height = 400;
  const g = c.getContext("2d");
  const two = p.people.length > 1;
  const S = two ? 72 : 95, ox = 150, oy = two ? 220 : 230; // torso length in px, hip centre
  p.people.forEach((kp, i) => {
    const P = (j) => [ox + kp[j].x * S, oy + kp[j].y * S];
    g.strokeStyle = i ? "#ff5fa2" : "#fff"; g.lineWidth = 5; g.lineCap = "round";
    g.beginPath();
    for (const [a, b] of BONES) if (kp[a] && kp[b]) { g.moveTo(...P(a)); g.lineTo(...P(b)); }
    g.stroke();
    if (kp[0]) { g.beginPath(); g.arc(...P(0), two ? 17 : 22, 0, Math.PI * 2); g.stroke(); }
    g.fillStyle = "#3ee6b0";
    for (const j of [13, 14, 15, 16, 25, 26, 27, 28]) if (kp[j]) { g.beginPath(); g.arc(...P(j), 5, 0, Math.PI * 2); g.fill(); }
  });
  card.appendChild(c);
  const name = document.createElement("b"); name.textContent = p.name; card.appendChild(name);
  const how = document.createElement("small"); how.textContent = p.how; card.appendChild(how);
  const tag = document.createElement("span"); tag.className = "tag" + (p.source ? " src" : "");
  tag.textContent = p.source ? "from photo" : p.prop ? "needs " + p.prop : p.modes.join(" · ");
  card.appendChild(tag);
  grid.appendChild(card);
}
</script>
</body>
</html>
